name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  # Production deploy remains via authenticated wrangler locally / Cloudflare dashboard.
  # Avoid dual competing deploy pipelines without CLOUDFLARE_API_TOKEN in GitHub.
