name: Verify NEPAR Studio public landing
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node --check src/server/public-landing.js
      - run: node scripts/test-public-landing.mjs
      - run: npx wrangler deploy --dry-run
